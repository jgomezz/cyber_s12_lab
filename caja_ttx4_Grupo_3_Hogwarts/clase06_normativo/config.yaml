# Clase 6 · Configuración del laboratorio · versión 6.1
# Para cambiar de modelo, edita solo "model". El proveedor por defecto se usa
# cuando no indicas --proveedor al ejecutar un escalón.
default: groq_oss       # ollama_cloud ya no está disponible (pide créditos)

providers:
  ollama_cloud:          # PRINCIPAL del curso: modelos grandes en ollama.com (cuenta gratuita, 1 consulta a la vez)
    model: openai/gpt-oss:120b
    api_base: https://ollama.com/v1
    api_key_env: OLLAMA_API_KEY

  ollama_cloud_20b:      # Segundo modelo en la misma cuenta de Ollama Cloud (más pequeño, para comparar)
    model: openai/gpt-oss:20b
    api_base: https://ollama.com/v1
    api_key_env: OLLAMA_API_KEY

  groq_oss:              # console.groq.com · REEMPLAZO del principal: el mismo gpt-oss-120b en el plan gratuito de Groq
    model: groq/openai/gpt-oss-120b
    api_key_env: GROQ_API_KEY

  groq:                  # console.groq.com · rápido y con herramientas: el segundo modelo de las comparaciones
    model: groq/qwen/qwen3.8-27b
    api_key_env: GROQ_API_KEY

  nvidia:                # build.nvidia.com · endpoint gratuito (el catálogo cambia: si falla, elijan otro modelo con "Free Endpoint")
    model: openai/openai/gpt-oss-20b
    api_base: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY

  ollama_local:          # OPCIONAL: solo si tu equipo tiene 16 GB de RAM o GPU ("ollama pull llama3.2:3b")
    model: ollama_chat/llama3.2:3b
    api_base: http://localhost:11434

# Embeddings para el RAG (escalones 2 y 3).
# local  -> en tu equipo, sin descargas ni API (búsqueda por términos). Es el valor por defecto.
# ollama -> OPCIONAL, embeddings semánticos con Ollama local: requiere "ollama pull nomic-embed-text"
embeddings:
  provider: ollama
  local_model: hash-1024
  ollama_model: nomic-embed-text
  ollama_base: http://localhost:11434

# Escalón 1: modelo de lenguaje de spaCy para detectar nombres y lugares en español
anonimizacion:
  spacy_model: es_core_news_md
  # Palabras que el modelo de spaCy confunde con nombres de persona (falsos positivos).
  # Agrega las que encuentres y vuelve a ejecutar el escalón 1.
  permitidos:
    - Directorio
